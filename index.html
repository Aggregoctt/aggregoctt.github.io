---
title: "All News"
layout: default
permalink: /
---

<script>
window.Aggregoctt = {
    data: {{ site.data | jsonify }},
    posts: [{% for post in site.posts %}{
        url: {{ post.url | jsonify }},
        link: {{ post.canonical_url | jsonify }},
        source: {{ post.source | jsonify }},
        title: {{ post.title | jsonify }},
        date: {{ post.date | jsonify }},
        tags: {{ post.tags | jsonify }},
        image: {{ post.image | jsonify }},
        excerpt: {{ post.excerpt | strip_html | strip_newlines | jsonify }},
    },{% endfor %}],
    site: {
        baseurl: {{ site.baseurl | jsonify }},
    },
};
</script>

<div class="container">
    {% if page.url == "/" %}
        <p><table id="Filters"><tbody><tr>
            <td><select name="categories" style="width: 100%;">
                <option value="">All Categories</option>
            </select></td>
            <td><select name="sources" style="width: 100%;">
                <option value="">All Sources</option>
            </select></td>
        </tr></tbody></table></p>
        <div class="row" id="Posts">
            <noscript><p>This site requires JavaScript.</p></noscript>
        </div>
        <button class="btn" id="AddPosts">Load older</button>
    {% endif %}
</div>

<div id="Reader" hidden="true" style="display: none; position: fixed; z-index: 1999; left: 0; right: 0; top: 0; bottom: 0; margin: auto; width: 90%; height: 90%; border: 10px solid gray; background: gray;">
    <span style="background: lightgray; width: 100%; display: block; height: 32px; padding: 4px;">
        <span style="width: calc(100% - 3em); display: inline-block; overflow: hidden; text-overflow: ellipsis; text-wrap: nowrap;"></span>
        <button class="btn" style="float: right; height: 24px; width: 3em; line-height: 16px; padding: 4px;" title="Close">❌</button>
    </span>
    <iframe style="height: calc(100% - 32px); width: 100%; border: none;"></iframe>
</div>

<script>(function(){

var postsStart, postsList;

var categories = Filters.querySelector('[name="categories"]');
var sources = Filters.querySelector('[name="sources"]');

for (var id in Aggregoctt.data.sources) {
    var source = Aggregoctt.data.sources[id];
    if (!categories.querySelector('option[value="'+source.category+'"]')) {
        categories.innerHTML += '<option value="'+source.category+'">'+source.category+'</option>';
    }
    sources.innerHTML += '<option value="'+id+'" data-category="'+source.category+'">'+(source.name?source.name:id)+'</option>';
}

function setReader(url) {
    Reader.querySelector('iframe').src = (url ? (Aggregoctt.site.baseurl + url + '#aggregoctt-embedded') : '');
    Reader.style.display = (url ? '' : 'none');
    Reader.hidden = !url;
}

function resetPosts(resetSource) {
    postsStart = 0;
    postsList = Aggregoctt.posts.filter(function(post){
        var category = Aggregoctt.data.sources[post.source].category;
        return (
            (!categories.value || (category === categories.value)) &&
            (!sources.value || (post.source === sources.value)));
    });

    if (resetSource) {
        sources.value = '';
        return resetPosts();
    }

    var sourcesList = sources.querySelectorAll('option');
    for (var i=1; i<sourcesList.length; i++) {
        var source = sourcesList[i];
        source.hidden = (categories.value && (source.getAttribute('data-category') !== categories.value));
    }

    Posts.innerHTML = '';
    addPosts();
}

function addPosts() {
    var count = 20;
    var start = postsStart;
    var posts = postsList.slice(start, (start + count));
    postsStart = (start + count);

    var site = window.Aggregoctt.site;
    var data = window.Aggregoctt.data;
    var postsHtml = '';
    for (var i in posts) {
        var post = posts[i];
        postsHtml += '{% raw %}<div class="col-md-6">'+
            '<div class="card border-0 mb-4 box-shadow">'+
                '<a data-href="'+post.url+'" href="'+post.link+'" target="_blank">'+
                    '<div class="topfirstimage" style="background-image: url(\''+(post.image ? site.baseurl+'/'+post.image : '')+'\');"></div>'+
                '</a>'+
                '<div class="card-body px-0 pb-0 d-flex flex-column align-items-start">'+
                    '<h2 class="h4 font-weight-bold" style="width: 100%;">'+
                        '<a class="text-dark" data-href="'+post.url+'" href="'+post.link+'" target="_blank">'+post.title+'</a>'+
                    '</h2>'+
                    '<p class="excerpt" style="width: 100%;">'+post.excerpt.trim().slice(0, 150)+'...</p>'+
                    '<div>'+
                        '<small class="d-block text-muted">'+
                            'In <span class="catlist">'+
                                '<a class="text-capitalize text-muted smoothscroll">'+post.source+'</a><span class="sep">, </span>'+
                                '<a class="text-capitalize text-muted smoothscroll">'+data.sources[post.source].category+'</a><span class="sep">, </span>'+
                            '</span>'+
                        '</small>'+
                        '<small class="text-muted">'+post.date.slice(0, -6)+'</small>'+
                    '</div>'+
                '</div>'+
            '</div>'+
        '</div>{% endraw %}';
    }
    Posts.innerHTML += postsHtml;

    var posts = Posts.querySelectorAll('a[data-href]');
    for (var i=0; i<posts.length; i++) {
        (function(post){
            var url = post.getAttribute('data-href');
            post.removeAttribute('data-href');
            post.onclick = function(ev){
                if (!ev.ctrlKey) {
                    ev.preventDefault();
                    setReader(url);
                }
            };
        })(posts[i]);
    }
}

resetPosts();

categories.onchange = function(){ resetPosts(true); };
sources.onchange = function(){ resetPosts(false); };
AddPosts.onclick = addPosts;
Reader.querySelector('button').onclick = function(){ setReader(); };

window.addEventListener('keydown', function(ev){
    if (ev.key === 'Escape') {
        setReader();
    }
});

})();</script>

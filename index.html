---
title: "All News"
layout: default
permalink: /
---

<script>

window.Aggregoctt = {
    templates: {},
    data: {{ site.data | jsonify }},
    posts: [{% for post in site.posts %}{
        url: {{ post.url | jsonify }},
        link: {{ post.canonical_url | jsonify }},
        source: {{ post.source | jsonify }},
        title: {{ post.title | jsonify }},
        date: {{ post.date | jsonify }},
        tags: {{ post.tags | jsonify }},
        image: {{ post.image | jsonify }},
        excerpt: {{ post.excerpt | strip_html | strip_newlines | jsonify }},
    },{% endfor %}],
    site: {
        baseurl: {{ site.baseurl | jsonify }},
    },
};

</script>

<div class="container">
    {% if page.url == "/" %}
        <p><table class="remove-site-content-margin" id="Filters"><tbody><tr>
            <td><select name="categories">
                <option value="">All Categories</option>
            </select></td>
            <td><select name="sources">
                <option value="">All Sources</option>
            </select></td>
        </tr></tbody></table></p>
        <div class="row" id="Posts"></div>
        <button class="btn" id="AddPosts">Load older</button>
    {% endif %}
</div>

<script>(function(){

var postsStart, postsList;

var categories = Filters.querySelector('[name="categories"]');
var sources = Filters.querySelector('[name="sources"]');

for (var id in Aggregoctt.data.sources) {
    var source = Aggregoctt.data.sources[id];
    if (!categories.querySelector('option[value="'+source.category+'"]')) {
        categories.innerHTML += '<option value="'+source.category+'">'+source.category+'</option>';
    }
    sources.innerHTML += '<option value="'+id+'" data-category="'+source.category+'">'+(source.name?source.name:id)+'</option>';
}

function resetPosts(resetSource) {
    postsStart = 0;
    postsList = Aggregoctt.posts.filter(function(post){
        var category = Aggregoctt.data.sources[post.source].category;
        return (
            (!categories.value || (category === categories.value)) &&
            (!sources.value || (post.source === sources.value)));
    });

    if (resetSource) {
        sources.value = '';
        return resetPosts();
    }

    var sourcesList = sources.querySelectorAll('option');
    for (var i=1; i<sourcesList.length; i++) {
        var source = sourcesList[i];
        source.hidden = (categories.value && (source.getAttribute('data-category') !== categories.value));
    }

    Posts.innerHTML = '';
    addPosts();
}

function addPosts() {
    var count = 20;
    var start = postsStart;
    var posts = postsList.slice(start, (start + count));
    postsStart = (start + count);

    var site = window.Aggregoctt.site;
    var data = window.Aggregoctt.data;
    for (var i in posts) {
        var post = posts[i];
        Posts.innerHTML += '{% raw %}<div class="col-md-6">'+
            '<div class="card border-0 mb-4 box-shadow">'+
                '<a data-href="{{ site.baseurl }}{{ post.url }}" href="'+post.link+'" target="_blank">'+
                    '<div class="topfirstimage" style="background-image: url('+(post.image ? site.baseurl+'/'+post.image : '')+');"></div>'+
                '</a>'+
                '<div class="card-body px-0 pb-0 d-flex flex-column align-items-start">'+
                    '<h2 class="h4 font-weight-bold">'+
                        '<a class="text-dark" data-href="{{ site.baseurl }}{{ post.url }}" href="'+post.link+'" target="_blank">'+post.title+'</a>'+
                    '</h2>'+
                    '<p class="excerpt">'+post.excerpt.trim().slice(0, 150)+'...</p>'+
                    '<div>'+
                        '<small class="d-block text-muted">'+
                            'In <span class="catlist">'+
                                '<a class="text-capitalize text-muted smoothscroll">'+post.source+'</a><span class="sep">, </span>'+
                                '<a class="text-capitalize text-muted smoothscroll" data-href="{{ site.baseurl }}/categories.html#{{ category | downcase }}">'+data.sources[post.source].category+'</a><span class="sep">, </span>'+
                            '</span>'+
                        '</small>'+
                        '<small class="text-muted">'+post.date.slice(0, -6)+'</small>'+
                    '</div>'+
                '</div>'+
            '</div>'+
        '</div>{% endraw %}';
    }
}

resetPosts();

categories.onchange = function(){ resetPosts(true); };
sources.onchange = function(){ resetPosts(false); };
AddPosts.onclick = addPosts;

})();</script>
